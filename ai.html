<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Question Bank</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e2a;
    --border: #252b3b;
    --accent1: #6ee7b7;
    --accent2: #f59e0b;
    --accent3: #818cf8;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-mid: #94a3b8;
    --ai-color: #f472b6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
    line-height: 1.7;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 200px;
    background: radial-gradient(ellipse, rgba(244,114,182,0.1) 0%, transparent 70%);
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ai-color);
  }
  header p {
    color: var(--text-mid);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    margin-top: 0.5rem;
    letter-spacing: 0.1em;
  }
  .home-link {
    position: absolute;
    left: 1.5rem;
    top: 1.2rem;
    z-index: 2;
    color: var(--text-dim);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }
  .home-link:hover { color: var(--ai-color); }
  .home-link:active { color: var(--ai-color); }

  main { padding: 2rem; max-width: 900px; margin: 0 auto; }

  .section-header {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .section-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--ai-color);
  }
  .section-header p {
    color: var(--text-mid);
    font-size: 0.9rem;
    margin-top: 0.3rem;
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 1.2rem;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .q-card:hover { border-color: #333d52; }

  .q-header {
    padding: 1.1rem 1.4rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    cursor: pointer;
    user-select: none;
  }
  .q-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.2rem 0.55rem;
    border-radius: 4px;
    background: rgba(244,114,182,0.12);
    color: var(--ai-color);
    flex-shrink: 0;
    margin-top: 0.15rem;
  }
  .q-text {
    flex: 1;
    font-size: 0.97rem;
    font-weight: 500;
    color: var(--text);
  }
  .q-toggle {
    font-size: 1.1rem;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: transform 0.25s;
    margin-top: 0.1rem;
  }
  .q-card.open .q-toggle { transform: rotate(180deg); }

  .q-answer {
    display: none;
    border-top: 1px solid var(--border);
    padding: 1.2rem 1.4rem 1.2rem 3.8rem;
    background: var(--surface2);
  }
  .q-card.open .q-answer { display: block; }

  .ans-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--ai-color);
    margin-bottom: 0.6rem;
  }

  .ans-text {
    font-size: 0.92rem;
    color: var(--text-mid);
    line-height: 1.75;
  }
  .ans-text strong { color: var(--text); font-style: normal; }
  .ans-text ul { padding-left: 1.2rem; margin-top: 0.4rem; }
  .ans-text ul li { margin-bottom: 0.3rem; }
  .ans-text .formula {
    font-family: 'IBM Plex Mono', monospace;
    background: rgba(255,255,255,0.05);
    padding: 0.6rem 1rem;
    border-radius: 5px;
    border-left: 3px solid var(--accent3);
    margin: 0.6rem 0;
    font-size: 0.85rem;
    color: #c4b5fd;
  }
  .ans-text .highlight {
    background: rgba(244,114,182,0.08);
    border-left: 3px solid var(--ai-color);
    padding: 0.6rem 1rem;
    border-radius: 0 5px 5px 0;
    margin: 0.6rem 0;
    color: var(--text);
  }
  table { border-collapse: collapse; width: 100%; margin: 0.6rem 0; font-size: 0.85rem; }
  th { background: rgba(255,255,255,0.05); padding: 0.5rem 0.8rem; text-align: left; color: var(--text); font-family: 'Syne', sans-serif; font-size: 0.8rem; border: 1px solid var(--border); }
  td { padding: 0.45rem 0.8rem; border: 1px solid var(--border); color: var(--text-mid); }

  .topic-divider {
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    padding: 0.5rem 0;
    margin: 1.5rem 0 0.8rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .topic-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    header { padding: 2.25rem 1.5rem 2rem; }
    header h1 { font-size: 2rem; }
    main { padding: 1.6rem; }
    .section-header h2 { font-size: 1.4rem; }
  }

  @media (max-width: 768px) {
    .home-link { position: static; display: block; text-align: center; margin-bottom: 0.75rem; font-size: 0.75rem; padding: 0.7rem 1rem; background: rgba(255,255,255,0.03); border-radius: 6px; }
    .section-header h2 { font-size: 1.3rem; }
    .section-header p { font-size: 0.8rem; }
  }

  @media (max-width: 600px) {
    header { padding: 2rem 1.1rem 1.7rem; }
    header h1 { font-size: 1.7rem; }
    header p { font-size: 0.7rem; }
    main { padding: 1.2rem; }
    .q-header { padding: 0.9rem 1.1rem; gap: 0.7rem; }
    .q-text { font-size: 0.93rem; }
    .q-answer { padding: 1rem 1.1rem 1rem 2.8rem; }
    .ans-text { font-size: 0.85rem; }
    .ans-label { font-size: 0.65rem; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    .topic-divider { font-size: 0.7rem; }
    .section-header h2 { font-size: 1.15rem; }
    footer { padding: 1.5rem; font-size: 0.65rem; }
  }

  @media (max-width: 400px) {
    header { padding: 1.75rem 0.9rem 1.5rem; }
    header h1 { font-size: 1.4rem; }
    header p { font-size: 0.6rem; }
    main { padding: 0.9rem; }
    .q-header { padding: 0.75rem 0.9rem; gap: 0.5rem; }
    .q-text { font-size: 0.88rem; }
    .q-answer { padding: 0.85rem 0.9rem 0.85rem 2rem; }
    .topic-divider { font-size: 0.6rem; }
    .section-header h2 { font-size: 1rem; }
    .section-header p { font-size: 0.72rem; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="home-link">← HOME</a>
  <h1>AI Exam Question Bank</h1>
  <p>Questions with full answers. Click to reveal.</p>
</header>

<main>
  <div class="section-header">
    <h2>Questions coming soon...</h2>
    <p>This section is being prepared. Questions will appear here once added.</p>
  </div>
</main>

<footer>
  AI Exam Question Bank · BCA · All questions sourced from course PDF
</footer>

<script>
  function toggle(card) {
    card.classList.toggle('open');
  }
</script>
</body>
</html>
